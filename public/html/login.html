    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>📋 PGRS</h1>
                <p>Pensioner Grievance Redressal System</p>
            </div>
            <div class="login-body">
                <form id="loginForm">
                    <!-- Keep your existing form fields -->
                    <div class="mb-3">
                        <label class="form-label">Pension Code</label>
                        <input type="text" id="pensioncode" 
                               class="form-control" 
                               placeholder="Enter your pension code" 
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" 
                               class="form-control" 
                               placeholder="Enter your password" 
                               required>
                    </div>

                    <div class="captcha-container">
                        <div class="g-recaptcha" 
                             data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100">
                        Login to Dashboard
                    </button>
                    
                    <div class="register-link">
                        <span class="text-muted">New to PGRS?</span>

                    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Loading Helper Functions
function showLoading(text = "Loading...") {
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.querySelector('.loading-text').innerText = text;
}

function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const ehrms = document.getElementById("pensioncode").value;
            const password = document.getElementById("password").value;
            const captchaResponse = grecaptcha.getResponse();

            if (!ehrms || !password) {
                alert("Please fill all fields");
                return;
            }

            if (!captchaResponse) {
                alert("Please complete the CAPTCHA");
                return;
            }

            try {
                const res = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                   body: JSON.stringify({ 
                    pensioncode: ehrms,  
                    password: password, 
                    captcha: captchaResponse 
                })
                });

                const data = await res.json();

                if (!res.ok) {
                    showToast(data.message, 'Login Failed');
                    grecaptcha.reset();
                    return;
                }

                showToast("Login successful!", 'success');
                // Store user data if needed
                if (data.user) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                }
                
                // Redirect to dashboard or feedback page
                if (
                    data.user.role === "FINANCE" ||
                    data.user.role === "ACCOUNTS" ||
                    data.user.role === "IT"
                ) {
                    window.location.href = "financeofficer1.html";
                } else {
                    window.location.href = "feedback.html";
                }
            } catch(err) {
                console.error("Fetch Error:", err);
                alert("Serveice not availabe. Please try again later.");
                grecaptcha.reset();
            }
        });
        // Dark Mode Toggle
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark);
    
    // Update button text
    const btn = document.querySelector('.dark-mode-toggle');
    btn.innerHTML = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

// Load dark mode preference on page load
window.addEventListener('DOMContentLoaded', () => {
    const isDark = localStorage.getItem('darkMode') === 'true';
    if (isDark) {
        document.body.classList.add('dark-mode');
        const btn = document.querySelector('.dark-mode-toggle');
        if (btn) btn.innerHTML = '☀️ Light Mode';
    }
});

//error
function showToast(message, type = 'success') {
    let container = document.getElementById('toastContainer');
    
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    
    const toast = document.createElement('div');
    toast.className = `custom-toast toast-${type}`;
    toast.innerHTML = `<span>${message}</span>`;
    
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}


    </script>
    <!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
</div>

<!-- Dark Mode Toggle -->
<button class="dark-mode-toggle" onclick="toggleDarkMode()">
    🌙 Dark Mode
