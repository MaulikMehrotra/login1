<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User dashboard</title>
    <link href="style.css" quiv="1.0" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🗒️ Pensioner Grievance Redressal System</a>
            <span class="navbar-subtitle" style="color: aliceblue;">Pensioner Grievance Redressal System</span>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                
            </div>
        </div>
    </nav>
    <div class="container mt-5">

    <div class="section-header text-center mb-3">
        Check Complaint Status
    </div>

    <div class="form-box p-4">

        <!-- <div class="row g-3 justify-content-center">

            <div class="col-md-4">
                <label>Enter Token Number</label>
                <input type="text" id="ticketId" class="form-control">
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" id="checkStatusBtn">
                    Check
                </button>
            </div>

        </div>

        <hr> -->

        <div id="ticketList" class="list-group mt-3"></div>

        <hr>

        <div id="resultBox" style="display:none;">

        <!-- RESULT SECTION -->
        <div id="resultBox" style="display:none;">

            <div class="row g-3 mt-2">

                <div class="col-md-3">
                    <label>Status</label>
                    <input type="text" id="status" class="form-control" readonly>
                </div>

                <div class="col-md-3">
                    <label>Category</label>
                    <input type="text" id="category" class="form-control" readonly>
                </div>

                <div class="col-md-3">
                    <label>Assigned To</label>
                    <input type="text" id="assigned_to" class="form-control" readonly>
                </div>

                <div class="col-md-3">
                    <label>Created At</label>
                    <input type="text" id="created_at" class="form-control" readonly>
                </div>

                <div class="col-md-12">
                    <label>Description</label>
                    <textarea id="description" class="form-control" rows="3" readonly></textarea>
                </div>

            </div>

        </div>
        <hr>
        <div id="messagesSection" style="display:none;">
            <h5 class="mt-3 mb-3">📩 Officer Messages</h5>
            <div id="messagesList" class="list-group"></div>
        </div>
    </div>

</div>
    
<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
</div>
<!-- Dark Mode Toggle -->
<button class="dark-mode-toggle" onclick="toggleDarkMode()">
    🌙 Dark Mode
</button>
</body>
<script>
    // Loading Helper Functions
function showLoading(text = "Loading...") {
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.querySelector('.loading-text').innerText = text;
}

function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}
document.addEventListener("DOMContentLoaded", async () => {

    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
        alert("Login first");
        window.location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`http://localhost:3000/user-tickets/${user.pensioncode}`);
        const tickets = await res.json();

        const container = document.getElementById("ticketList");
        container.innerHTML = "";

        if (tickets.length === 0) {
            container.innerHTML = "<p>No tickets found</p>";
            return;
        }

        tickets.forEach(t => {

            // 🔥 BONUS COLOR LOGIC
            const badgeColor = 
                t.status === "RESOLVED" ? "bg-success" :
                t.status === "IN_PROGRESS" ? "bg-primary" :
                "bg-warning";

            container.innerHTML += `
                <div class="list-group-item list-group-item-action"
                     style="cursor:pointer"
                     onclick="loadTicket(${t.ticket_id})">
                     
                    <strong>#${t.ticket_id}</strong> - ${t.category}
                    
                    <span class="badge ${badgeColor} float-end">
                        ${t.status}
                    </span>
                </div>
            `;
        });

    } catch (err) {
        console.error(err);
        alert("Server error");
    }

});



async function loadTicket(ticketId) {

    const res = await fetch(`http://localhost:3000/ticket-status/${ticketId}`);
    const data = await res.json();

    document.getElementById("status").value = data.status;
    document.getElementById("category").value = data.category;
    document.getElementById("assigned_to").value = data.assigned_to;
    document.getElementById("created_at").value = data.created_at;
    document.getElementById("description").value = data.description;

    document.getElementById("resultBox").style.display = "block";

    // Load messages for this ticket
    try {
        const msgRes = await fetch(`http://localhost:3000/messages/${ticketId}`);
        const messages = await msgRes.json();
        
        const msgContainer = document.getElementById("messagesList");
        const msgSection = document.getElementById("messagesSection");
        
        msgContainer.innerHTML = "";
        
        if (messages.length > 0) {
            msgSection.style.display = "block";
            
            messages.forEach(msg => {
                const date = new Date(msg.created_at).toLocaleString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                msgContainer.innerHTML += `
                    <div class="list-group-item">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">Officer Update</h6>
                            <small class="text-muted">${date}</small>
                        </div>
                        <p class="mb-0">${msg.message}</p>
                    </div>
                `;
            });
        } else {
            msgSection.style.display = "none";
        }
    } catch (err) {
        console.error("Failed to load messages:", err);
    }
}
// Dark Mode Toggle
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark);
    
    // Update button text
    const btn = document.querySelector('.dark-mode-toggle');
    btn.innerHTML = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

// Load dark mode preference on page load
window.addEventListener('DOMContentLoaded', () => {
    const isDark = localStorage.getItem('darkMode') === 'true';
    if (isDark) {
        document.body.classList.add('dark-mode');
        const btn = document.querySelector('.dark-mode-toggle');
        if (btn) btn.innerHTML = '☀️ Light Mode';
    }
});

function showToast(message, type = 'success') {
    let container = document.getElementById('toastContainer');
    
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    
    const toast = document.createElement('div');
    toast.className = `custom-toast toast-${type}`;
    toast.innerHTML = `<span>${message}</span>`;
    
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
</script>
</html>
